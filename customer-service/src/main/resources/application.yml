spring:
  application:
    name: customer-service
  # The datasource is configured by SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (see .env.example)
  jpa:
    hibernate:
      # Flyway owns the schema (db/migration); Hibernate only checks that the entities match it
      ddl-auto: validate
    # No lazy loading during view rendering: every read happens inside a service transaction
    open-in-view: false
  mvc:
    problem-details:
      enabled: true
  jackson:
    deserialization:
      # Reject 1.5 for an integer field instead of silently truncating it to 1
      accept-float-as-int: false
management:
  endpoint:
    health:
      probes:
        enabled: true
