# VoltStore frontend (change frontend-deployment, design D2): serves the built app and
# forwards /api/* to the API Gateway with /api stripped, like the Vite dev proxy.
# `api-gateway` is the gateway's name in both Docker Compose and Kubernetes.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # The trailing slash of proxy_pass replaces the /api/ prefix with /.
    location /api/ {
        proxy_pass http://api-gateway:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Above Payment's worst case (about 6 s through Order).
        proxy_read_timeout 30s;
    }

    # Vite fingerprints these files, so they never change under one name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Deep links: every other path is the app; index.html is revalidated on each load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
