<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VoltStore</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--primary); }
  .tint { fill:var(--primary-soft); }
  .deep { fill:var(--ink); }
  .volt { fill:var(--volt); }
  .mint { fill:var(--art-mint); }
  .blk { rx:var(--radius-md); }
  .dot { fill:var(--primary); }
  .dot.on-deep { fill:var(--volt); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:80px; line-height:.92; font-weight:700; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      primary 128x232 bled off the top (identity, largest) · ink 176x152 (the deep counter surface) · primary-soft 176x64 (tint) · volt 64x64 (the spark, small) · art-mint 32x64 sliver — about 30% of 960x288
  arrangement one tall primary slab with a modular cluster to its right, bottoms on one line space-6 above the edge, space-4 gutters
  pattern     dot grid, from "clean and precise, like a well-lit electronics counter": 4px dots at a space-4 pitch, a circuit-board grid on the tint and the ink block (volt dots on ink)
  scales      sides in space-4 multiples; gutters space-4; pitch space-4; corners radius-md (10px)
-->
<rect class="brand blk" x="32" y="-24" width="128" height="288" rx="10"/>
<rect class="tint blk" x="176" y="16" width="176" height="64" rx="10"/>
<rect class="volt blk" x="368" y="16" width="64" height="64" rx="10"/>
<rect class="deep blk" x="176" y="96" width="176" height="168" rx="10"/>
<rect class="mint blk" x="368" y="96" width="64" height="168" rx="10"/>
<g>
<circle class="dot" cx="200" cy="40" r="2"/><circle class="dot" cx="216" cy="40" r="2"/><circle class="dot" cx="232" cy="40" r="2"/><circle class="dot" cx="248" cy="40" r="2"/><circle class="dot" cx="264" cy="40" r="2"/><circle class="dot" cx="280" cy="40" r="2"/><circle class="dot" cx="296" cy="40" r="2"/><circle class="dot" cx="312" cy="40" r="2"/><circle class="dot" cx="328" cy="40" r="2"/>
<circle class="dot" cx="200" cy="56" r="2"/><circle class="dot" cx="216" cy="56" r="2"/><circle class="dot" cx="232" cy="56" r="2"/><circle class="dot" cx="248" cy="56" r="2"/><circle class="dot" cx="264" cy="56" r="2"/><circle class="dot" cx="280" cy="56" r="2"/>
<circle class="dot on-deep" cx="296" cy="216" r="2"/><circle class="dot on-deep" cx="312" cy="216" r="2"/><circle class="dot on-deep" cx="328" cy="216" r="2"/>
<circle class="dot on-deep" cx="280" cy="232" r="2"/><circle class="dot on-deep" cx="296" cy="232" r="2"/><circle class="dot on-deep" cx="312" cy="232" r="2"/><circle class="dot on-deep" cx="328" cy="232" r="2"/>
<circle class="dot on-deep" cx="264" cy="248" r="2"/><circle class="dot on-deep" cx="280" cy="248" r="2"/><circle class="dot on-deep" cx="296" cy="248" r="2"/><circle class="dot on-deep" cx="312" cy="248" r="2"/><circle class="dot on-deep" cx="328" cy="248" r="2"/>
</g>
</svg>
</div>
<div class="words">
<h1 class="name">VoltStore</h1>
<p class="tag">Electronics, clearly laid out.</p>
</div>
</div>
</body>
</html>
