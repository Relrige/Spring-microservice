spring:
  application:
    name: api-gateway
  http:
    clients:
      # Upstream calls: an unreachable upstream fails fast (502), a slow one is cut off (504).
      # The read timeout leaves room for upstreams that call other services with retries (catalog -> inventory).
      connect-timeout: 2s
      read-timeout: 15s
  cloud:
    gateway:
      server:
        webmvc:
          # Explicit allowlist: one route per method + path pair, no wildcards. Anything not listed is a 404.
          # Paths are forwarded unchanged. Each route needs metadata.authMode (PUBLIC | OPTIONAL | REQUIRED) and,
          # for REQUIRED routes, optionally metadata.roles (comma-separated), and must apply the TrustBoundary
          # filter (strip/authenticate/authorize/propagate). RouteAccessPolicy refuses to start otherwise.
          routes:
            # --- auth-service ---
            - id: auth-register
              uri: ${gateway.upstreams.auth}
              predicates:
                - Method=POST
                - Path=/user/register
              filters:
                - TrustBoundary
              metadata:
                authMode: PUBLIC
            - id: auth-login
              uri: ${gateway.upstreams.auth}
              predicates:
                - Method=POST
                - Path=/auth/login
              filters:
                - TrustBoundary
              metadata:
                authMode: PUBLIC
            - id: auth-create-non-customer
              uri: ${gateway.upstreams.auth}
              predicates:
                - Method=POST
                - Path=/user/non-customer
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: ADMIN

            # --- catalog-service ---
            # Optional: catalog managers get extra filters; a stale token is a 401, not a silent guest
            - id: catalog-browse-products
              uri: ${gateway.upstreams.catalog}
              predicates:
                - Method=GET
                - Path=/catalog/products
              filters:
                - TrustBoundary
              metadata:
                authMode: OPTIONAL
            # Optional: staff also see inactive products; a stale token is a 401, not a silent guest.
            # {id} is a UUID, so the internal GET /catalog/products/batch-get never matches here
            - id: catalog-get-product
              uri: ${gateway.upstreams.catalog}
              predicates:
                - Method=GET
                - Path=/catalog/products/{id:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}}
              filters:
                - TrustBoundary
              metadata:
                authMode: OPTIONAL
            - id: catalog-create-product
              uri: ${gateway.upstreams.catalog}
              predicates:
                - Method=POST
                - Path=/catalog/products
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: CATALOG_MANAGER
            - id: catalog-update-product
              uri: ${gateway.upstreams.catalog}
              predicates:
                - Method=PUT
                - Path=/catalog/products/{id:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}}
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: CATALOG_MANAGER
            - id: catalog-change-product-status
              uri: ${gateway.upstreams.catalog}
              predicates:
                - Method=PATCH
                - Path=/catalog/products/{id:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}}/status
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: CATALOG_MANAGER
            - id: catalog-list-categories
              uri: ${gateway.upstreams.catalog}
              predicates:
                - Method=GET
                - Path=/catalog/categories
              filters:
                - TrustBoundary
              metadata:
                authMode: PUBLIC
            - id: catalog-create-category
              uri: ${gateway.upstreams.catalog}
              predicates:
                - Method=POST
                - Path=/catalog/categories
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: CATALOG_MANAGER
            - id: catalog-modify-category
              uri: ${gateway.upstreams.catalog}
              predicates:
                - Method=PUT,DELETE
                - Path=/catalog/categories/{id:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}}
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: CATALOG_MANAGER

            # --- inventory-service ---
            # Not routed (internal): GET .../readiness, GET .../packaging, /inventory/reservations/**
            - id: inventory-view-stock
              uri: ${gateway.upstreams.inventory}
              predicates:
                - Method=GET
                - Path=/inventory/stock
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: INVENTORY_WORKER
            - id: inventory-adjust-stock
              uri: ${gateway.upstreams.inventory}
              predicates:
                - Method=POST
                - Path=/inventory/stock/{id:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}}/adjust
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: INVENTORY_WORKER
            # Only PUT: GET on the same path is internal
            - id: inventory-set-packaging
              uri: ${gateway.upstreams.inventory}
              predicates:
                - Method=PUT
                - Path=/inventory/stock/{id:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}}/packaging
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: INVENTORY_WORKER

            # --- customer-service ---
            # {productId} is a catalog product UUID
            - id: customer-get-profile
              uri: ${gateway.upstreams.customer}
              predicates:
                - Method=GET
                - Path=/customers/me/profile
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: CUSTOMER
            - id: customer-update-profile
              uri: ${gateway.upstreams.customer}
              predicates:
                - Method=PUT
                - Path=/customers/me/profile
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: CUSTOMER
            - id: customer-get-cart
              uri: ${gateway.upstreams.customer}
              predicates:
                - Method=GET
                - Path=/customers/cart
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: CUSTOMER
            - id: customer-replace-cart
              uri: ${gateway.upstreams.customer}
              predicates:
                - Method=PUT
                - Path=/customers/cart
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: CUSTOMER
            - id: customer-clear-cart
              uri: ${gateway.upstreams.customer}
              predicates:
                - Method=DELETE
                - Path=/customers/cart
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: CUSTOMER
            - id: customer-merge-cart
              uri: ${gateway.upstreams.customer}
              predicates:
                - Method=POST
                - Path=/customers/cart/merge
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: CUSTOMER
            - id: customer-add-cart-item
              uri: ${gateway.upstreams.customer}
              predicates:
                - Method=POST
                - Path=/customers/cart/items
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: CUSTOMER
            - id: customer-update-cart-item
              uri: ${gateway.upstreams.customer}
              predicates:
                - Method=PATCH
                - Path=/customers/cart/items/{productId:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}}
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: CUSTOMER
            - id: customer-remove-cart-item
              uri: ${gateway.upstreams.customer}
              predicates:
                - Method=DELETE
                - Path=/customers/cart/items/{productId:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}}
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: CUSTOMER

            # --- delivery-service ---
            # Not routed (internal): GET /delivery/shipments, DELETE /delivery/shipments/{orderId}
            - id: delivery-retry-ttn
              uri: ${gateway.upstreams.delivery}
              predicates:
                - Method=POST
                - Path=/delivery/orders/{id:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}}/ttn/retry
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: INVENTORY_WORKER

            # --- order-service ---
            # Every customer route needs a token: only registered customers order (2026-10-16); ownership is
            # checked in the service. {id} is a UUID, so GET /orders/fulfillment-queue never matches /orders/{id}
            - id: order-validate
              uri: ${gateway.upstreams.order}
              predicates:
                - Method=POST
                - Path=/orders/validate
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: CUSTOMER
            - id: order-submit
              uri: ${gateway.upstreams.order}
              predicates:
                - Method=POST
                - Path=/orders
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: CUSTOMER
            - id: order-history
              uri: ${gateway.upstreams.order}
              predicates:
                - Method=GET
                - Path=/orders
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: CUSTOMER
            - id: order-details-or-cancel
              uri: ${gateway.upstreams.order}
              predicates:
                - Method=GET,DELETE
                - Path=/orders/{id:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}}
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: CUSTOMER
            - id: order-pay
              uri: ${gateway.upstreams.order}
              predicates:
                - Method=POST
                - Path=/orders/{id:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}}/pay
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: CUSTOMER
            - id: order-fulfillment-queue
              uri: ${gateway.upstreams.order}
              predicates:
                - Method=GET
                - Path=/orders/fulfillment-queue
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: INVENTORY_WORKER
            - id: order-ship
              uri: ${gateway.upstreams.order}
              predicates:
                - Method=POST
                - Path=/orders/{id:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}}/ship
              filters:
                - TrustBoundary
              metadata:
                authMode: REQUIRED
                roles: INVENTORY_WORKER

auth:
  jwt:
    leeway: 30s

management:
  server:
    # Actuator (health probes) on its own port, which is neither published nor routed: /actuator/** on the
    # public port 8080 is a 404 like any other unrouted path
    port: 8090
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        # Prometheus scrapes /actuator/prometheus (k8s/monitoring/); nothing else beyond health is exposed
        include: health,prometheus
  metrics:
    tags:
      # Every series carries the service name, so dashboards and alerts can tell services apart
      application: ${spring.application.name}
    distribution:
      # Histogram buckets for HTTP latency, so p95 can be computed in Prometheus (alert HighHttpLatency)
      percentiles-histogram:
        http.server.requests: true
