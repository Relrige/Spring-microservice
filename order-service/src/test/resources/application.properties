auth.internal.token=internal-token-internal-token-1234567
# The cancellation retry job is run by hand in its tests; never in the background
order.cancellation.retry-interval=1h
order.recovery.interval=1h

# gRPC clients use Netty like in production (FakeInventory listens on a local port); the in-process transport, if
# ever on the classpath, must not take over the channels
spring.grpc.client.inprocess.enabled=false
