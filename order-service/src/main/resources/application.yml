spring:
  application:
    name: order-service
  jpa:
    hibernate:
      ddl-auto: update
  mvc:
    problem-details:
      enabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        # Prometheus scrapes /actuator/prometheus (k8s/monitoring/); nothing else beyond health is exposed
        include: health,prometheus
  metrics:
    tags:
      # Every series carries the service name, so dashboards and alerts can tell services apart
      application: ${spring.application.name}
    distribution:
      # Histogram buckets for HTTP latency, so p95 can be computed in Prometheus (alert HighHttpLatency)
      percentiles-histogram:
        http.server.requests: true

clients:
  catalog:
    url: http://catalog-service:8081

resilience4j:
  circuitbreaker:
    instances:
      catalogClient:
        failureRateThreshold: 50
        minimumNumberOfCalls: 4
        slidingWindowSize: 10
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
  retry:
    instances:
      catalogClient:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        enableRandomizedWait: true
  bulkhead:
    instances:
      catalogClient:
        maxConcurrentCalls: 10
