# SonarCloud automatic analysis reads this file, not sonar-project.properties (that one is for the scanner CLI).
# Keep the source and exclusion settings in both files the same.
# Rule-by-path ignores (snake_case test names, Math.random in load-tests/, :latest images in k8s/) cannot be set here:
# they are set once in the SonarCloud project (Administration > General Settings > Analysis Scope > Ignore Issues on Multiple Criteria).

sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/src/test/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,**/build/**,**/*.zip,frontend/src/api/generated/**,frontend/public/mockServiceWorker.js,**/playwright-report/**,**/test-results/**,docs/reports/**
sonar.java.source=25
