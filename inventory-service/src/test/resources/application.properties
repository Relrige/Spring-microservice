auth.internal.token=internal-token-internal-token-1234567
# The product data backfill calls Catalog; tests call ProductDataBackfill directly instead of waiting for it, and a
# scheduled run in the middle of a test would make unexpected Catalog requests
inventory.product-data-backfill.interval=1d

# Every test context starts the gRPC server: a free port each, never the fixed 9090
spring.grpc.server.port=0
