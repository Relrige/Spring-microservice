spring:
  application:
    name: auth-service
  jpa:
    hibernate:
      ddl-auto: validate
  mvc:
    problem-details:
      enabled: true
  autoconfigure:
    # Callers are identified by gateway headers; there is no username/password login, so no default in-memory user
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

auth:
  jwt:
    expiration: 1h

# OpenAPI documents (docs/design/services-requirements/openapi-conventions.md, D2/D3/D8). Off by default: Compose turns
# both on through SPRINGDOC_* environment variables; OpenApiDocumentTest turns api-docs on for itself.
springdoc:
  api-docs:
    enabled: false
    version: openapi_3_1
  swagger-ui:
    enabled: false
    # Read-only: "Try it out" would bypass the gateway
    supported-submit-methods: []
  # Stable committed snapshot: pretty-printed with sorted keys
  writer-with-default-pretty-printer: true
  writer-with-order-by-keys: true
  # Controllers answer JSON; without this every response is documented as */*
  default-produces-media-type: application/json
  # Error responses are declared per operation (@ApiResponse) and by ErrorResponsesCustomizer, not inferred from
  # GlobalExceptionHandler, whose handlers carry no @ResponseStatus
  override-with-generic-response: false

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        # Prometheus scrapes /actuator/prometheus (k8s/monitoring/); nothing else beyond health is exposed
        include: health,prometheus
  metrics:
    tags:
      # Every series carries the service name, so dashboards and alerts can tell services apart
      application: ${spring.application.name}
    distribution:
      # Histogram buckets for HTTP latency, so p95 can be computed in Prometheus (alert HighHttpLatency)
      percentiles-histogram:
        http.server.requests: true
