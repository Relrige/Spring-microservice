# SonarQube / SonarCloud scanner settings for the whole monorepo.
# sonar.projectKey (and sonar.organization on SonarCloud) are passed on the command line or set here.

sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/src/test/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,**/build/**,**/*.zip,frontend/src/api/generated/**,docs/reports/**
sonar.java.binaries=**/target/classes
sonar.java.test.binaries=**/target/test-classes

# Rules that conflict with team conventions or do not fit the context.
sonar.issue.ignore.multicriteria=testNames,testThrows,testAssertj,loadRandom,k8sTag,k8sStorageLimit,k8sStorageRequest

# Test methods use snake_case names (given_when_then).
sonar.issue.ignore.multicriteria.testNames.ruleKey=java:S100
sonar.issue.ignore.multicriteria.testNames.resourceKey=**/src/test/**
# assertThrows lambdas that build their arguments inline.
sonar.issue.ignore.multicriteria.testThrows.ruleKey=java:S5778
sonar.issue.ignore.multicriteria.testThrows.resourceKey=**/src/test/**
# AssertJ style preferences.
sonar.issue.ignore.multicriteria.testAssertj.ruleKey=java:S5838
sonar.issue.ignore.multicriteria.testAssertj.resourceKey=**/src/test/**
# k6 load tests pick random products and users; not security-relevant.
sonar.issue.ignore.multicriteria.loadRandom.ruleKey=javascript:S2245
sonar.issue.ignore.multicriteria.loadRandom.resourceKey=load-tests/**
# Local minikube images are built as :latest; no ephemeral-storage limits on a single dev node.
sonar.issue.ignore.multicriteria.k8sTag.ruleKey=kubernetes:S6596
sonar.issue.ignore.multicriteria.k8sTag.resourceKey=k8s/**
sonar.issue.ignore.multicriteria.k8sStorageLimit.ruleKey=kubernetes:S6870
sonar.issue.ignore.multicriteria.k8sStorageLimit.resourceKey=k8s/**
sonar.issue.ignore.multicriteria.k8sStorageRequest.ruleKey=kubernetes:S6897
sonar.issue.ignore.multicriteria.k8sStorageRequest.resourceKey=k8s/**
