      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10

  delivery-service:
    container_name: delivery-service
    build:
      context: ./delivery-service
