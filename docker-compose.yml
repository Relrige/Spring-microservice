services:
  # catalog-service section
  catalog-service-postgres:
    container_name: catalog-service-pg
    image: postgres:18-alpine
    volumes:
      - catalog-service-postgres:/var/lib/postgresql
    env_file:
      - catalog-service/.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-service:
    container_name: catalog-service
    build:
      context: ./catalog-service
    depends_on:
      catalog-service-postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    env_file:
      - catalog-service/.env

  # order-service section
  order-service-postgres:
    container_name: order-service-pg
    image: postgres:18-alpine
