      interval: 5s
      timeout: 5s
      retries: 10

  order-service:
    container_name: order-service
    build:
      context: ./order-service
    depends_on:
      order-service-postgres:
        condition: service_healthy
    ports:
      - "8082:8080"
    env_file:
      - order-service/.env

  # delivery-service section
