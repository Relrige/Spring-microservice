services:
  # kafka section
  # Single-node Kafka broker in KRaft mode (no ZooKeeper), shared by all services.
  # Addresses:
  #   - inside the Compose network: kafka:9092   (SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092)
  #   - from the host / IDE:        localhost:9094 (SPRING_KAFKA_BOOTSTRAP_SERVERS=localhost:9094)
  # Clients connect to the *advertised* address of a listener, so each listener advertises the
  # name that is resolvable from where its clients run.
  kafka:
    container_name: kafka
    image: apache/kafka:4.1.0
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Fixed ID (generated with kafka-storage.sh random-uuid) so the data volume matches on every restart
      CLUSTER_ID: 1e2h0ow3Q1aZMPR7Ue30PA
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics are declared by the owning services; a typo in a topic name must fail, not create a topic
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Single broker: internal topics cannot have more than one replica
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # auth-service section
  auth-service-postgres:
    container_name: auth-service-pg
    image: postgres:18-alpine
    volumes:
      - auth-service-postgres:/var/lib/postgresql
    env_file:
      - auth-service/.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    container_name: auth-service
    build:
      context: ./auth-service
    depends_on:
      auth-service-postgres:
        condition: service_healthy
    ports:
      - "8086:8080"
    env_file:
      - auth-service/.env

  # catalog-service section
  catalog-service-postgres:
    container_name: catalog-service-pg
    image: postgres:18-alpine
    volumes:
      - catalog-service-postgres:/var/lib/postgresql
    env_file:
      - catalog-service/.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-service:
    container_name: catalog-service
    build:
      context: ./catalog-service
    depends_on:
      catalog-service-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    env_file:
      - catalog-service/.env

  # order-service section
  order-service-postgres:
    container_name: order-service-pg
    image: postgres:18-alpine
    volumes:
      - order-service-postgres:/var/lib/postgresql
    env_file:
      - order-service/.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10

  order-service:
    container_name: order-service
    build:
      context: ./order-service
    depends_on:
      order-service-postgres:
        condition: service_healthy
    ports:
      - "8082:8080"
    env_file:
      - order-service/.env

  # delivery-service section
  delivery-service-postgres:
    container_name: delivery-service-pg
    image: postgres:18-alpine
    volumes:
      - delivery-service-postgres:/var/lib/postgresql
    env_file:
      - delivery-service/.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10

  delivery-service:
    container_name: delivery-service
    build:
      context: ./delivery-service
    depends_on:
      delivery-service-postgres:
        condition: service_healthy
    ports:
      - "8083:8080"
    env_file:
      - delivery-service/.env

  # inventory-service section
  inventory-service-postgres:
    container_name: inventory-service-pg
    image: postgres:18-alpine
    volumes:
      - inventory-service-postgres:/var/lib/postgresql
    env_file:
      - inventory-service/.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory-service:
    container_name: inventory-service
    build:
      context: ./inventory-service
    depends_on:
      inventory-service-postgres:
        condition: service_healthy
    ports:
      - "8084:8080"
    env_file:
      - inventory-service/.env

  # payment-service section
  payment-service-postgres:
    container_name: payment-service-pg
    image: postgres:18-alpine
    volumes:
      - payment-service-postgres:/var/lib/postgresql
    env_file:
      - payment-service/.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-service:
    container_name: payment-service
    build:
      context: ./payment-service
    depends_on:
      payment-service-postgres:
        condition: service_healthy
    ports:
      - "8085:8080"
    env_file:
      - payment-service/.env

volumes:
  kafka-data:
  auth-service-postgres:
  catalog-service-postgres:
  order-service-postgres:
  delivery-service-postgres:
  inventory-service-postgres:
  payment-service-postgres: