spring:
  application:
    name: payment-service
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it
      ddl-auto: validate
  mvc:
    problem-details:
      enabled: true
  autoconfigure:
    # Callers are identified by the internal token; there is no username/password login, so no default in-memory user
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
payment:
  gateway:
    # Which PaymentGateway adapter is used. Only "mock" exists (MockPaymentGateway); any other value fails at startup
    provider: ${PAYMENT_GATEWAY_PROVIDER:mock}
    # Time limit of one gateway call; after it the outcome is unknown (the money may have moved). The mock waits this
    # long before reporting the "lost answer" of a card ending in 5000
    timeout: ${PAYMENT_GATEWAY_TIMEOUT:2s}
    # A call with an unknown outcome is repeated with the same idempotency key, so a repeat cannot charge twice.
    # Worst case per request: 2 x 2 s + 0.3-0.45 s = about 4.5 s, so Order Service's read timeout for /payments/**
    # must be longer (6 s or more), or Order gives up before Payment has recorded the outcome
    max-retries: ${PAYMENT_GATEWAY_MAX_RETRIES:1}
    retry-delay: ${PAYMENT_GATEWAY_RETRY_DELAY:300ms}
auth:
  internal:
    # Shared secret of service-to-service calls (X-Internal-Token); supplied by the INTERNAL_TOKEN environment variable
    token: ${INTERNAL_TOKEN}
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        # Prometheus scrapes /actuator/prometheus (k8s/monitoring/); nothing else beyond health is exposed
        include: health,prometheus
  metrics:
    tags:
      # Every series carries the service name, so dashboards and alerts can tell services apart
      application: ${spring.application.name}
    distribution:
      # Histogram buckets for HTTP latency, so p95 can be computed in Prometheus (alert HighHttpLatency)
      percentiles-histogram:
        http.server.requests: true
  # Tracing (observability task 02). Spans go to the collector only when
  # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set (Kubernetes ConfigMap); Compose, tests and IDE runs
  # export nothing. The span resource attribute service.name is spring.application.name.
  tracing:
    sampling:
      # Every request is traced; the collector decides which traces to keep (tail sampling, task 04)
      probability: 1.0
    propagation:
      # W3C traceparent (the default, set so the choice is visible)
      type: w3c
  observations:
    enable:
      # Scheduled jobs start no traces of their own (empty relay and recovery runs would flood Tempo)
      tasks.scheduled: false

# ECS JSON on the console everywhere: tests, IDE, Compose and Kubernetes print the same lines (observability task 05,
# decision 4). One JSON object per line, with traceId and spanId from the tracing context; the collector agent
# tails the pod logs and ships them to Loki.
logging:
  structured:
    format:
      console: ecs
