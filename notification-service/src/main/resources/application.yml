spring:
  application:
    name: notification-service
  # The datasource is configured by SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (see .env.example)
  jpa:
    hibernate:
      # Flyway owns the schema (db/migration); Hibernate only checks that the entities match it
      ddl-auto: validate
    # No lazy loading during view rendering: every read happens inside a service transaction
    open-in-view: false
  mvc:
    problem-details:
      enabled: true
  autoconfigure:
    # Nobody logs in to Notification (it has no callers), so no default in-memory user and no generated password
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        # Only the probes; nothing else is exposed
        include: health
