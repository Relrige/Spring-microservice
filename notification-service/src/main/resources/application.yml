spring:
  application:
    name: notification-service
  # The datasource is configured by SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (see .env.example)
  jpa:
    hibernate:
      # Flyway owns the schema (db/migration); Hibernate only checks that the entities match it
      ddl-auto: validate
    # No lazy loading during view rendering: every read happens inside a service transaction
    open-in-view: false
  mvc:
    problem-details:
      enabled: true
  autoconfigure:
    # Nobody logs in to Notification (it has no callers), so no default in-memory user and no generated password
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  task:
    scheduling:
      pool:
        # One scheduler runs the sender job and the cleanup job; with the default single thread a slow sender run
        # (an SMTP timeout per row) would delay the cleanup and the other way round
        size: 2
  mail:
    # SMTP server: Mailpit in Compose and Kubernetes (SPRING_MAIL_HOST=mailpit). Credentials come from
    # SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD; Mailpit needs none, so they stay unset
    host: localhost
    port: 1025
    default-encoding: UTF-8
    properties:
      # Milliseconds. Without them a hung server would block the sender job forever (JavaMail waits indefinitely)
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  kafka:
    # Overridden by SPRING_KAFKA_BOOTSTRAP_SERVERS (kafka:9092 in Compose/Kubernetes); this default is
    # the broker's host listener from docker-compose.yml, for running the service from the IDE
    bootstrap-servers: localhost:9094
    producer:
      # The only records Notification produces are consumed records forwarded unchanged (JSON text) to its DLTs
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        # How long send() may block waiting for broker metadata (default 60 s)
        max.block.ms: 5000
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Values are read as JSON text and parsed by EventReader, by the type the eventType header names
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Offsets are committed after every record of a poll has been processed (the default, stated explicitly), so
      # only after the handler's database transaction committed. A crash mid-batch redelivers the uncommitted
      # records; the handlers deduplicate by eventId, so that is harmless.
      ack-mode: batch
      # Order's and Delivery's topics may not exist yet: the listeners wait for them instead of failing
      missing-topics-fatal: false
notification:
  mail:
    # Sender of every email; parsed at startup
    from: ${NOTIFICATION_MAIL_FROM:VoltStore <no-reply@voltstore.com>}
  sender:
    # The sender job (EP-NOTIF-JOB-01); false switches it off (tests that only check the listeners)
    enabled: true
    # Fixed delay between runs; each run claims up to batch-size due PENDING notifications
    interval: 2s
    batch-size: 20
    # A claim moves next_attempt_at forward by this much, so another replica does not pick the notification while
    # it is being sent; far longer than the SMTP timeouts (connect 5 s + read/write 10 s)
    lease: 2m
    # First attempt at once, then 4 retries after these waits; one more failure after the last is FAILED
    backoff: 30s, 2m, 10m, 30m
  # Times shown in emails (payment deadline, time of payment)
  time-zone: ${NOTIFICATION_TIME_ZONE:Europe/Kyiv}
  kafka:
    topics:
      # Owned by Order Service: OrderPlaced, OrderPaid, OrderShipped, OrderCancelled (told apart by the eventType
      # header). Notification only subscribes and never declares it
      order-events: ${ORDER_EVENTS_TOPIC:order.order-events}
      # Owned by Delivery Service: OrderDelivered (and TTNGenerated, which is skipped)
      delivery-events: ${DELIVERY_EVENTS_TOPIC:delivery.shipment-events}
management:
  health:
    mail:
      # An SMTP outage must not make the service unhealthy: the listeners keep recording and the sender job
      # retries; the pending-notifications gauge shows the outage instead
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        # Only the probes; nothing else is exposed
        include: health
