spring:
  application:
    name: delivery-service
  jpa:
    hibernate:
      # Flyway owns the schema (db/migration); Hibernate only checks that the entities match it
      ddl-auto: validate
  mvc:
    problem-details:
      enabled: true
  task:
    scheduling:
      pool:
        # One scheduler runs the outbox relay and cleanup, the TTN generation job and the mock carrier's delivery
        # reports; with the default single thread a slow relay run would delay all the others
        size: 4
  autoconfigure:
    # Callers are identified by gateway headers; there is no username/password login, so no default in-memory user
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jackson:
    deserialization:
      # Reject 1.5 for an integer field instead of silently truncating it to 1
      accept-float-as-int: false
  kafka:
    # Overridden by SPRING_KAFKA_BOOTSTRAP_SERVERS (kafka:9092 in Compose/Kubernetes); this default is
    # the broker's host listener from docker-compose.yml, for running the service from the IDE
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      # Same values as the kafka-clients 4.x defaults, stated explicitly because delivery guarantees are a design
      # decision: wait for all in-sync replicas, and let retries never duplicate or reorder a message
      acks: all
      properties:
        enable.idempotence: true
        # How long send() may block waiting for broker metadata (default 60 s); keeps a dead broker from tying up
        # the outbox relay for a minute per attempt
        max.block.ms: 5000
        spring.json.add.type.headers: false
    consumer:
      group-id: delivery-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Values are read as JSON text; the target class is taken from the @KafkaListener parameter by the message
      # converter in KafkaConfig
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Consumer spans continue the traceparent header of the record (observability task 03)
      observation-enabled: true
      # Offsets are committed after every record of a poll has been processed (the default, stated explicitly), so
      # only after the listener's database transaction committed. A crash mid-batch redelivers the uncommitted
      # records; the consumers are idempotent by state, so that is harmless.
      ack-mode: batch
      # Order's topic may not exist yet (Order does not publish): the listener waits for it instead of failing
      missing-topics-fatal: false
clients:
  inventory:
    # Compose: http://inventory-service:8080; Kubernetes: http://inventory-service:8084 (Service port). The default
    # is the host port of Inventory in docker-compose.yml, for running Delivery from the IDE
    url: ${INVENTORY_SERVICE_URL:http://localhost:8084}
    connect-timeout: ${INVENTORY_CONNECT_TIMEOUT:2s}
    read-timeout: ${INVENTORY_READ_TIMEOUT:3s}
    # No retry inside the call: the TTN generation job's attempts are the retries
auth:
  internal:
    # Shared secret of service-to-service calls (X-Internal-Token): checked on Order's calls, sent on calls to
    # Inventory. Same variable name and value as in auth-service and Catalog
    token: ${AUTH_INTERNAL_TOKEN}
delivery:
  kafka:
    topics:
      # Owned by Order Service; carries OrderPaid and OrderShipped (told apart by the eventType header). PROVISIONAL
      # name following the <service>.<aggregate>-events convention (same default as in Inventory); Delivery only
      # subscribes and never declares it
      order-events: ${ORDER_EVENTS_TOPIC:order.order-events}
  outbox:
    # How often the relay looks for unpublished shipment events (fixed delay between runs)
    relay-interval: 500ms
    batch-size: 50
    # Waiting longer than this for a broker acknowledgment counts as a failed attempt (the event may still
    # arrive, and is then sent twice: delivery is at-least-once)
    publish-timeout: 10s
    # Exponential back-off per failing event (1 s, 2 s, 4 s, ...) is capped here; later events of the same
    # order wait for it, other orders do not
    max-retry-delay: 5m
    # Published events are deleted after this long by a job running every cleanup-interval
    retention: 7d
    cleanup-interval: 1h
  ttn-job:
    # The automatic TTN generation job (Tier 1); false switches it off (tests that only check other parts)
    enabled: true
    # Fixed delay between runs; each run claims up to batch-size due TTN_PENDING shipments
    interval: 1s
    batch-size: 20
    # A claim moves next_attempt_at forward by this much, so another replica does not pick the shipment while the
    # attempt runs; must be longer than the slowest attempt (Inventory 2 s + 3 s per product, plus the carrier)
    lease: 2m
    # First attempt immediately, then 3 retries after these waits; after the last one the shipment is TTN_FAILED
    backoff: 5s, 30s, 2m
  carrier:
    mock:
      # In-process mock carrier (MockCarrierGateway): probability that register/cancel fail (0.0-1.0), their
      # latency, and the time between a handover and the delivery report (shorten it for e2e tests)
      failure-rate: ${DELIVERY_CARRIER_MOCK_FAILURE_RATE:0.0}
      latency: ${DELIVERY_CARRIER_MOCK_LATENCY:0}
      delivery-delay: ${DELIVERY_CARRIER_MOCK_DELIVERY_DELAY:30s}
# OpenAPI documents (docs/design/services-requirements/openapi-conventions.md, D2/D3/D8). Off by default: Compose turns
# both on through SPRINGDOC_* environment variables; OpenApiDocumentTest turns api-docs on for itself.
springdoc:
  api-docs:
    enabled: false
    version: openapi_3_1
  swagger-ui:
    enabled: false
    # Read-only: "Try it out" would bypass the gateway
    supported-submit-methods: []
  # Stable committed snapshot: pretty-printed with sorted keys
  writer-with-default-pretty-printer: true
  writer-with-order-by-keys: true
  # Controllers answer JSON; without this every response is documented as */*
  default-produces-media-type: application/json
  # Error responses are declared per operation (@ApiResponse) and by ErrorResponsesCustomizer, not inferred from
  # GlobalExceptionHandler, whose handlers carry no @ResponseStatus
  override-with-generic-response: false

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        # Prometheus scrapes /actuator/prometheus (k8s/monitoring/); nothing else beyond health is exposed
        include: health,prometheus
  metrics:
    tags:
      # Every series carries the service name, so dashboards and alerts can tell services apart
      application: ${spring.application.name}
    distribution:
      # Histogram buckets for HTTP latency, so p95 can be computed in Prometheus (alert HighHttpLatency)
      percentiles-histogram:
        http.server.requests: true
  # Tracing (observability task 02). Spans go to the collector only when
  # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set (Kubernetes ConfigMap); Compose, tests and IDE runs
  # export nothing. The span resource attribute service.name is spring.application.name.
  tracing:
    sampling:
      # Every request is traced; the collector decides which traces to keep (tail sampling, task 04)
      probability: 1.0
    propagation:
      # W3C traceparent (the default, set so the choice is visible)
      type: w3c
  observations:
    enable:
      # Scheduled jobs start no traces of their own (empty relay and recovery runs would flood Tempo)
      tasks.scheduled: false
