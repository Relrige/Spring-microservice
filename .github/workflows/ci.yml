name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Each service is an independent Maven project, so let every module report
      # its own result instead of cancelling the rest on the first failure.
      fail-fast: false
      matrix:
        module:
          - api-gateway
          - auth-service
          - catalog-service
          - customer-service
          - delivery-service
          - inventory-service
          - order-service
          - payment-service
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml

      # Testcontainers uses the Docker daemon that GitHub-hosted Ubuntu runners provide.
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.module }}
          path: ${{ matrix.module }}/target/surefire-reports/
          if-no-files-found: ignore
