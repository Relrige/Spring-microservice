# Gateway OpenTelemetry Collector: receives spans from every service (OTLP gRPC 4317 / HTTP 4318) and exports them
# to Tempo. Configuration: otel-collector-config.yaml. The services reach it as http://otel-collector:4318.
#
# The contrib distribution, not the core one: tail_sampling (task 04), filelog and k8sattributes (the agent) are
# only in contrib.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: voltstore
spec:
  # Exactly one: tail sampling needs all spans of a trace in one instance. Scaling out would need a loadbalancing
  # exporter that routes by trace id in front of several samplers
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      annotations:
        # Scraped by Prometheus (k8s/monitoring/prometheus-config.yaml)
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8888"
      labels:
        app: otel-collector
        app.kubernetes.io/part-of: voltstore
        app.kubernetes.io/component: observability
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.130.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otelcol/config.yaml
          env:
            # Go's garbage collector aims below this; ~80 % of the memory limit
            - name: GOMEMLIMIT
              value: 400MiB
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: metrics
              containerPort: 8888
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: voltstore
spec:
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
