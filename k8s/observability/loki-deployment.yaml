# Grafana Loki: log storage. Receives from the agent collectors only (http://loki:3100/otlp), queried by Grafana.
# Configuration: loki-config.yaml.
#
# Storage is an emptyDir, like Prometheus and Tempo: logs survive container restarts but not a pod deletion. The
# kubelet's files on the node still hold the most recent lines.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: voltstore
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "3100"
      labels:
        app: loki
        app.kubernetes.io/part-of: voltstore
        app.kubernetes.io/component: observability
    spec:
      # Security task: no Kubernetes API token in the pod (it never calls the API), non-root, default seccomp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loki
          image: grafana/loki:3.5.3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ ALL ]
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - name: http
              containerPort: 3100
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            # The ingester waits a moment before it reports ready
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: { }
        - name: config
          configMap:
            name: loki-config
        - name: data
          emptyDir: { }
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: voltstore
spec:
  type: ClusterIP
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
