# Grafana's admin account. Like the other *-secret-template.yaml files it is committed with placeholders only:
#   1. Copy this file to k8s/observability/secret.yaml (git-ignored by the **/secret.yaml rule) and put a real
#      password in. "kubectl apply -f k8s/observability/" applies files alphabetically, so secret.yaml comes after
#      this template and its values win.
#   2. kubectl rollout restart deployment/grafana -n voltstore
# Grafana stores the password in its database on the first start; with the emptyDir that database is recreated
# with every new pod, so a changed Secret takes effect on the next pod.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: voltstore
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: change-me
