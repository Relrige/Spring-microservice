# Grafana Tempo: trace storage. Receives from the gateway collector only (tempo:4317), queried by Grafana
# (http://tempo:3200). Configuration: tempo-config.yaml.
#
# Storage is an emptyDir, like Prometheus: traces survive container restarts but not a pod deletion.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: voltstore
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "3200"
      labels:
        app: tempo
        app.kubernetes.io/part-of: voltstore
        app.kubernetes.io/component: observability
    spec:
      # Security task: no Kubernetes API token in the pod (it never calls the API), non-root, default seccomp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tempo
          image: grafana/tempo:2.8.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ ALL ]
          args:
            - -config.file=/etc/tempo/tempo.yaml
          ports:
            - name: http
              containerPort: 3200
            - name: otlp-grpc
              containerPort: 4317
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/tempo
            - name: data
              mountPath: /var/tempo
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3200
            # The ingester joins its ring before it reports ready
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: { }
        - name: config
          configMap:
            name: tempo-config
        - name: data
          emptyDir: { }
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: voltstore
spec:
  type: ClusterIP
  selector:
    app: tempo
  ports:
    - name: http
      port: 3200
      targetPort: 3200
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
