# Alertmanager configuration. A Secret, not a ConfigMap, because it holds the Telegram bot token.
# Like the other *-secret-template.yaml files it is committed with placeholders only. To receive alerts:
#   1. Create a bot: in Telegram, talk to @BotFather, send /newbot, copy the token (123456789:AA...).
#   2. Send any message to the bot (or add it to a group), then open
#      https://api.telegram.org/bot<TOKEN>/getUpdates and copy "chat":{"id": ...}; group ids are negative.
#   3. Copy this file to k8s/monitoring/secret.yaml (git-ignored by the **/secret.yaml rule), put the token and
#      chat id in, and apply it. "kubectl apply -f k8s/monitoring/" applies files alphabetically, so secret.yaml
#      comes after this template and its values win.
#   4. kubectl rollout restart deployment/alertmanager -n voltstore
# Never commit a real token: anyone who has it can post as the bot. If it leaks, /revoke it in @BotFather.
#
# With the placeholders Alertmanager starts and routes alerts, but Telegram rejects the sends (visible in the
# Alertmanager log as "notify retry canceled ... 404").
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: voltstore
type: Opaque
stringData:
  alertmanager.yml: |
    templates:
      - /etc/alertmanager/templates/*.tmpl

    route:
      receiver: telegram
      # One notification per alert name and service: ten failing pods of one service are one message
      group_by: [ alertname, application ]
      # Wait for related alerts before the first message of a group
      group_wait: 30s
      # A group that is already notified: changes (a new alert, a resolved one) are sent at most this often
      group_interval: 5m
      # A group that keeps firing unchanged is reminded of this often
      repeat_interval: 4h
      routes:
        # A broken user-facing function: send quicker and remind more often
        - matchers: [ severity="critical" ]
          receiver: telegram
          group_wait: 10s
          repeat_interval: 1h

    inhibit_rules:
      # A service that is down also has no traffic, high latency or errors in its callers' view: while ServiceDown
      # or ServiceMissing fires, the warnings of the same service are not sent
      - source_matchers: [ alertname=~"ServiceDown|ServiceMissing" ]
        target_matchers: [ severity="warning" ]
        equal: [ application ]

    receivers:
      - name: telegram
        telegram_configs:
          - bot_token: "000000000:change-me-telegram-bot-token"
            # Integer, not a string; negative for a group chat
            chat_id: 123456789
            parse_mode: HTML
            message: '{{ template "voltstore.telegram.message" . }}'
            # Also report when the problem is gone
            send_resolved: true
