# The gateway only verifies user JWTs. AUTH_JWT_SECRET must have the same value as in auth-secrets
# (k8s/auth/app-secret-template.yaml): Auth Service signs with it, the gateway verifies with it.
# Anyone who holds it can mint tokens, so it never goes into the ConfigMap or the image.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: voltstore
type: Opaque
stringData:
  AUTH_JWT_SECRET: "change-me-local-dev-secret-at-least-32-bytes-long"
