# The only Service the Ingress forwards to. The management port (8090, health probes) is deliberately not exposed.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: voltstore
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
