# The API Gateway is the only external entry point: every path goes to it unchanged (no rewrite), and it
# routes by method + path to the services. Services have no Ingress rules of their own.
# TLS is not terminated here in the local setup (plain HTTP through "minikube tunnel").
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voltstore-ingress
  namespace: voltstore
  labels:
    app: voltstore-platform
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
