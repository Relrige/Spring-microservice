apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voltstore-ingress
  namespace: voltstore
  labels:
    app: voltstore-platform
  annotations:
    # Вказуємо, що використовуємо nginx як Ingress controller
    kubernetes.io/ingress.class: nginx
    # Використовуємо регулярні вирази для шляхів
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Переписуємо шлях, відкидаючи префікс сервісу (напр. /catalog), але залишаючи все, що після нього ($2)
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
    - http:
        paths:
          - path: /catalog(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: catalog-service
                port:
                  number: 8081
          - path: /orders(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 8082
          - path: /delivery(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: delivery-service
                port:
                  number: 8083
          - path: /inventory(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: inventory-service
                port:
                  number: 8084
          - path: /payment(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 8085