apiVersion: v1
kind: Secret
metadata:
  name: order-db-secret
  labels:
    app: order-postgres
type: Opaque
stringData:
  POSTGRES_DB: orderdb
  POSTGRES_USER: order
  POSTGRES_PASSWORD: orderpass
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-postgres-pvc
  labels:
    app: order-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-postgres
  labels:
    app: order-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-postgres
  template:
    metadata:
      labels:
        app: order-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine
        ports:
        - containerPort: 5432
          name: postgres
        envFrom:
        - secretRef:
            name: order-db-secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: order-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: order-postgres
  labels:
    app: order-postgres
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  selector:
    app: order-postgres
