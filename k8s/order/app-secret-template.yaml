# App-only secrets: the Postgres pod does not receive them (it only loads order-db-credentials).
# INTERNAL_TOKEN must have the same value as AUTH_INTERNAL_TOKEN / INTERNAL_TOKEN in the other services
# (see k8s/auth/app-secret-template.yaml and k8s/payment/app-secret-template.yaml) and at least 32 characters;
# Order sends it on every call to Catalog, Inventory, Payment and Delivery.
apiVersion: v1
kind: Secret
metadata:
  name: order-secrets
  namespace: voltstore
type: Opaque
stringData:
  INTERNAL_TOKEN: "change-me-local-internal-token-at-least-32-chars"
