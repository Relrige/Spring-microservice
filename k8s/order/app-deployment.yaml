apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: voltstore
spec:
  # One replica is enough for the local minikube cluster. More are safe: the outbox relay takes an advisory lock,
  # the cancellation job claims each order through its version, the expiry job is idempotent, and the Delivery-events
  # listener shares its partitions within the consumer group
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        app.kubernetes.io/part-of: voltstore
        app.kubernetes.io/component: service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: order-service
          image: voltstore/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: order-config
            - secretRef:
                name: order-db-credentials
            # INTERNAL_TOKEN, app pod only (k8s/order/app-secret-template.yaml)
            - secretRef:
                name: order-secrets
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
