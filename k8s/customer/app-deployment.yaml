apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: voltstore
spec:
  # One replica is enough for the local minikube cluster; scale up temporarily to test that the cart lock
  # serialises writers across pods and that the replicas share one consumer group
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      annotations:
        # Scraped by Prometheus (k8s/monitoring/prometheus-config.yaml)
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
      labels:
        app: customer-service
        app.kubernetes.io/part-of: voltstore
        app.kubernetes.io/component: service
    spec:
      # Security task: no Kubernetes API token in the pod (it never calls the API), non-root, default seccomp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: customer-service
          image: voltstore/customer-service:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ ALL ]
          # The root file system is read-only; these paths must stay writable
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: customer-config
            - secretRef:
                name: customer-db-credentials
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: { }