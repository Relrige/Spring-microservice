apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: voltstore
data:
  CATALOG_DB_URL: "jdbc:postgresql://catalog-service-postgres:5432/catalog-service"
  INVENTORY_DB_URL: "jdbc:postgresql://inventory-db:5432/inventory_db"
  ORDER_DB_URL: "jdbc:postgresql://order-db:5432/order_db"
  PAYMENT_DB_URL: "jdbc:postgresql://payment-db:5432/payment_db"
  DELIVERY_DB_URL: "jdbc:postgresql://delivery-db:5432/delivery_db"

  JAVA_TOOL_OPTIONS: "-XX:+UseZGC -Xlog:gc*"