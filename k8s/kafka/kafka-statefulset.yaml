# Single-node Kafka broker in KRaft mode (broker and controller in one process, no ZooKeeper).
#
# Image: apache/kafka:4.1.0, the official Apache Kafka image, pinned (never "latest").
# Why Kafka rather than a queue broker: a log-based broker keeps messages after they are consumed,
# supports replay, consumer groups and per-key ordering within a partition. That fits events such as
# ProductStockReplenished / ProductStockDepleted for the same product (key = productId).
#
# Known limitation: one broker means replication factor 1 for every topic (no fault tolerance).
# Acceptable for the study project; topics declared by services must use replicas = 1.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: voltstore
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Otherwise Kubernetes injects KAFKA_PORT=tcp://... for the "kafka" Service, and the image
      # turns every KAFKA_* variable into a broker setting, which breaks startup
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:4.1.0
          ports:
            - name: kafka
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENERS
              value: "INTERNAL://:9092,CONTROLLER://:9093"
            # Clients connect to the advertised address, so it must be the Service name, not the pod IP
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "INTERNAL://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: CLUSTER_ID
              value: "1e2h0ow3Q1aZMPR7Ue30PA"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            # Topics are declared by the owning services; a typo in a topic name must fail loudly
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            # Single broker: internal topics cannot have more than one replica
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms256m -Xmx384m"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
