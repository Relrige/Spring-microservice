# Mailpit's SMTP port: only Notification sends email. The web UI / API (8025) gets no rule, so it is reached only
# with kubectl port-forward
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailpit-smtp-from-notification-service
  namespace: voltstore
spec:
  podSelector:
    matchLabels:
      app: mailpit
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: notification-service
      ports:
        - port: 1025
---
# Monitoring (k8s/monitoring/): Prometheus scrapes /actuator/prometheus of the services on their HTTP port. The
# policies add up, so this widens rule 3 by one more allowed client and nothing else
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: services-from-prometheus
  namespace: voltstore
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 8080
---
# The gateway's metrics are on its management port, which nothing else may reach
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-management-from-prometheus
  namespace: voltstore
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 8090
---
# Alertmanager receives alerts only from Prometheus. Its notifications to Telegram are egress, which is not
# restricted. The UIs of both are reached with kubectl port-forward, which these policies do not affect
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-from-prometheus
  namespace: voltstore
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 9093
