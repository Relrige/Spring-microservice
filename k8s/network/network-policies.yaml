# Network trust boundary (API Gateway spec, "Trust Boundary"): services trust the X-User-* headers only
# because nothing but the gateway and other services can reach them.
#
# Enforced only by a CNI that supports NetworkPolicy. minikube's default CNI silently ignores these
# objects; start minikube with "--cni=calico" (see k8s.txt).
#
# Only ingress is restricted. Pods are selected by the labels app.kubernetes.io/component
# (frontend | gateway | service | database | broker | mail | monitoring) and app (the individual workload).
# kubectl port-forward enters the pod directly and is not affected (used by the e2e/manual runbooks).

# 1. Nothing in the namespace accepts traffic unless a policy below allows it
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: voltstore
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# 2. The frontend accepts traffic from the Ingress controller (minikube addon namespace "ingress-nginx")
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-from-ingress-controller
  namespace: voltstore
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
---
# 2a. The gateway accepts traffic from the frontend's /api proxy and from the Ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-ingress-controller
  namespace: voltstore
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
      ports:
        - port: 8080
---
# 3. Services accept traffic from the gateway and from other services (service-to-service calls with
#    X-Internal-Token), nothing else
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: services-from-gateway-and-services
  namespace: voltstore
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: service
      ports:
        - port: 8080
---
# 4. The Kafka broker accepts clients (the services) on 9092; the controller listener (9093) is used only
#    inside the broker pod
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-from-services
  namespace: voltstore
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: broker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: service
      ports:
        - port: 9092
---
