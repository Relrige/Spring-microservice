apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: voltstore
spec:
  type: ClusterIP
  selector:
    app: inventory-service
  ports:
    - name: http
      port: 8084
      targetPort: 8080
    # gRPC StockService for Order (task grpc-order-inventory)
    - name: grpc
      port: 9090
      targetPort: 9090
