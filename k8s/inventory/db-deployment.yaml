apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inventory-postgres-pvc
  namespace: voltstore
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service-postgres
  namespace: voltstore
spec:
  replicas: 1
  # Never two PostgreSQL processes on one data directory: the default RollingUpdate starts the new pod before the
  # old one stops, and both write the same WAL (it corrupted the Delivery database once)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: inventory-service-postgres
  template:
    metadata:
      labels:
        app: inventory-service-postgres
        app.kubernetes.io/part-of: voltstore
        app.kubernetes.io/component: database
    spec:
      # Security task: no Kubernetes API token in the pod (it never calls the API), non-root, default seccomp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ ALL ]
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: inventory-config
            - secretRef:
                name: inventory-db-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: run-postgresql
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - mountPath: /var/lib/postgresql/data
              name: postgres-data
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: run-postgresql
          emptyDir: { }
        - name: tmp
          emptyDir: { }
        - name: postgres-data
          persistentVolumeClaim:
            claimName: inventory-postgres-pvc
