apiVersion: v1
kind: Secret
metadata:
  name: inventory-secrets
  namespace: voltstore
type: Opaque
stringData:
  # Shared secret of service-to-service calls (X-Internal-Token); must be identical in every service
  # (AUTH_INTERNAL_TOKEN in auth-secrets) and at least 32 characters
  INTERNAL_TOKEN: "change-me-local-internal-token-at-least-32-chars"
