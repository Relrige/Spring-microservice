# App-only secrets: the Postgres pod does not receive them (it only loads catalog-db-credentials).
# AUTH_INTERNAL_TOKEN must have the same value in every service (see k8s/auth/app-secret-template.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: catalog-secrets
  namespace: voltstore
type: Opaque
stringData:
  AUTH_INTERNAL_TOKEN: "change-me-local-internal-token-at-least-32-chars"
