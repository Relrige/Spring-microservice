# Database only: used by both the catalog app and its Postgres pod (app-only secrets are in app-secret-template.yaml)
apiVersion: v1
kind: Secret
metadata:
  name: catalog-db-credentials
  namespace: voltstore
type: Opaque
stringData:
  POSTGRES_USER: "catalog-service"
  POSTGRES_PASSWORD: "catalog-service"
  SPRING_DATASOURCE_USERNAME: "catalog-service"
  SPRING_DATASOURCE_PASSWORD: "catalog-service"