# No caller uses this Service (the gateway does not route to Notification); it gives the pod a stable name for
# kubectl port-forward to the actuator endpoints
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: voltstore
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8088
      targetPort: 8080
