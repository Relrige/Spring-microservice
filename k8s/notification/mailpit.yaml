# Mailpit: the local SMTP server that accepts every message (Notification spec D4). It lives in k8s/notification/
# because Notification is its only client, like its database. SMTP (1025) is reachable only from Notification
# (k8s/network/network-policies.yaml); the web UI and REST API (8025) are not exposed outside the cluster:
#   kubectl port-forward -n voltstore svc/mailpit 8025:8025   → http://localhost:8025
# Messages are kept in memory, so a restart of the pod empties the mailbox
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: voltstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
        app.kubernetes.io/part-of: voltstore
        app.kubernetes.io/component: mail
    spec:
      # Security task: no Kubernetes API token in the pod (it never calls the API), non-root, default seccomp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mailpit
          # Same tag as docker-compose.yml and the Testcontainers tests
          image: axllent/mailpit:v1.27.10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ ALL ]
          # The root file system is read-only; these paths must stay writable
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8025
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8025
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: { }
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: voltstore
spec:
  type: ClusterIP
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: http
      port: 8025
      targetPort: 8025
