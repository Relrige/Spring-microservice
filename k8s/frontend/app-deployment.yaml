# The web app (frontend/Dockerfile): nginx serves the built SPA and forwards /api/* to the api-gateway
# Service with /api stripped (frontend/deploy/nginx.conf).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: voltstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/part-of: voltstore
        app.kubernetes.io/component: frontend
    spec:
      # Security task: no Kubernetes API token in the pod (it never calls the API), non-root, default seccomp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: voltstore/frontend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ ALL ]
          # The root file system is read-only; these paths must stay writable
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache-nginx
              mountPath: /var/cache/nginx
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: { }
        - name: cache-nginx
          emptyDir: { }
