apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: voltstore
spec:
  # Must stay at one replica: the mock payment gateway keeps its idempotency keys in memory per pod, so a second pod
  # would not recognise a repeated request and could charge twice
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      annotations:
        # Scraped by Prometheus (k8s/monitoring/prometheus-config.yaml)
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
      labels:
        app: payment-service
        app.kubernetes.io/part-of: voltstore
        app.kubernetes.io/component: service
    spec:
      # Security task: no Kubernetes API token in the pod (it never calls the API), non-root, default seccomp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payment-service
          image: voltstore/payment-service:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ ALL ]
          # The root file system is read-only; these paths must stay writable
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: payment-config
            - secretRef:
                name: payment-db-credentials
            - secretRef:
                name: payment-secrets
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: { }