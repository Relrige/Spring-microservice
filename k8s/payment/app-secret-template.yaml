# App-only secrets: the Postgres pod does not receive them (it only loads payment-db-credentials).
# INTERNAL_TOKEN must have the same value as AUTH_INTERNAL_TOKEN / INTERNAL_TOKEN in the other services
# (see k8s/auth/app-secret-template.yaml and k8s/inventory/app-secret-template.yaml) and at least 32 characters.
apiVersion: v1
kind: Secret
metadata:
  name: payment-secrets
  namespace: voltstore
type: Opaque
stringData:
  INTERNAL_TOKEN: "change-me-local-internal-token-at-least-32-chars"
